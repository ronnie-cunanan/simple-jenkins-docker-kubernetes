apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-flask-app
  labels:
    app: my-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-flask-app
  template:
    metadata:
      labels:
        app: my-flask-app
    spec:
      imagePullSecrets:
        - name: ecr-secret    
      containers:
        - name: my-flask-app
          image: nginx:latest   # placeholder, Jenkins overrides this
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
